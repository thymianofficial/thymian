openapi: 3.1.0
info:
  title: 'Test API'
  description: 'Test API'
  version: '1.0.0'
paths:
  /api/hello:
    get:
      summary: 'GET api/hello'
      operationId: 'hello'
      parameters:
        - name: 'name'
          in: 'query'
          required: true
          schema:
            type: 'string'
        - name: 'page'
          in: 'query'
          required: false
          schema:
            type: 'integer'
      responses:
        '200':
          description: 'OK'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Data'
components:
  schemas:
    Data:
      type: 'object'
      properties:
        content:
          type: 'string'
      required:
        - 'content'
