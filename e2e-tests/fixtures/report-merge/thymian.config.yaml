# `reports` and `specifications` are deliberately present: `report merge`
# reads CLI arguments only (#362 review decision), and the e2e suite proves
# these entries are ignored — do not remove them to "clean up".
reports:
  - type: thymian
    location: thymian-report.json
  - type: spectral
    location: spectral-findings.json
specifications:
  - type: openapi
    location: test.openapi.yaml
plugins:
  '@thymian/plugin-openapi': {}
  '@thymian/plugin-spectral': {}
  '@thymian/plugin-reporter':
    options:
      formatters:
        markdown: {}
        json: {}
        csv: {}
